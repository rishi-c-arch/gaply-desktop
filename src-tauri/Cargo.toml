[workspace]
members = ["gaply-core"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
description = "Gaply desktop shell (Tauri) — thin wrapper over gaply_core"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gaply_core = { path = "gaply-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
