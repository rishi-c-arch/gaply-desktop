[workspace]
members = ["gaply-core"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
description = "Gaply desktop shell (Tauri) — thin wrapper over gaply_core"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# `src/bin/ai-eval.rs` made this package multi-binary, which left `cargo run`
# (and so `tauri dev`) unable to choose. The app is the default; ai-eval is a
# dev harness run explicitly with `--bin ai-eval`.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# **DEV-ONLY BINARIES — excluded from a production bundle by construction.**
#
# `gaply.app/Contents/MacOS/` shipped `grrb` beside `app` (measured 22 Sep 2026,
# docs/PROBLEM_DOSSIER.md), and `src/bin/grrb.rs` calls
# `std::process::Command::new("git")` — an external process inside the shipped
# app. None of these five is named in tauri.conf.json; they were auto-discovered
# bin targets, so the bundler saw them.
#
# `required-features` is the cargo-level fix: without `--features devtools`
# these targets are not built at all, so a production build has nothing to
# bundle. Development is unchanged — `cargo run --bin grrb --features devtools`
# — and what the benchmark measures is untouched.
#
# OBSERVED, NOT EXPLAINED: of the five, only `grrb` was ever copied into the
# bundle, and it is the only one whose name contains no hyphen. That is a
# correlation across five cases, not a cause; tauri-cli ships as a prebuilt
# binary so the selection logic cannot be read here. The fix does not depend on
# knowing why.
[features]
devtools = []

[[bin]]
name = "grrb"
path = "src/bin/grrb.rs"
required-features = ["devtools"]

[[bin]]
name = "grrb-gate"
path = "src/bin/grrb-gate.rs"
required-features = ["devtools"]

[[bin]]
name = "ai-eval"
path = "src/bin/ai-eval.rs"
required-features = ["devtools"]

[[bin]]
name = "label-cn"
path = "src/bin/label-cn.rs"
required-features = ["devtools"]

[[bin]]
name = "label-cs"
path = "src/bin/label-cs.rs"
required-features = ["devtools"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
sha2 = "0.10"
gaply_core = { path = "gaply-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
# Phase-1 auth: origin-stable session store, deep-link OAuth callback, and
# opening the system browser for the OAuth consent screen.
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Phase-3 real HTTP core. rustls-tls (NOT native-tls) → no OpenSSL, keeps the
# green Windows CI. `blocking` is added because gaply-core's HttpFetcher trait
# is synchronous by design (the core crate is sync); the blocking client gives
# a sync API backed by rustls. The verify stage runs under spawn_blocking so it
# never blocks the async runtime thread.
# `cookies` and `gzip`/`brotli` are not conveniences: journal publishers behind
# Cloudflare-style filters reject a request whose header set is incomplete.
# Measured 14 Sep 2026 — see `http_fetcher.rs`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "cookies", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
# Journal crawl: resolving relative hrefs and comparing hosts. Already in the
# lock file via reqwest, so this adds no download — declared directly because a
# dependency of a dependency is not in scope for this crate.
url = "2"

# Supplementary-file parsing (PublishReady, APP-CRATE ONLY — gaply-core stays
# pure). calamine: pure-Rust Excel reader (xlsx/xls/ods), no C libs, no OpenSSL.
# csv: pure-Rust streaming CSV reader (calamine does not read CSV). Both are
# memory-capped by the parser BEFORE full load (see src/supplementary.rs).
calamine = "0.26"
csv = "1"

# SLM-1 (AI-detection) real model runtime — candle, APP-CRATE ONLY so gaply-core
# stays ML-free/sync/portable (the ReqwestFetcher precedent; `cargo test -p
# gaply_core` pulls none of this). CPU backend by default. A local quantized
# Qwen2 GGUF is loaded from a LOCAL PATH — deliberately NO `hf-hub` (it defaults
# to native-tls → OpenSSL, which would break the no-OpenSSL/green-Windows-CI
# guarantee). `tokenizers` with default-features disabled to avoid pulling the
# oniguruma C library; a Qwen2 BPE tokenizer.json loads via the pure-Rust path.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
matfile = "=0.5.0"
ambers = "=0.4.4"
arrow = { version = "=57.3.1", default-features = false }

# On Windows/Linux the OS launches a NEW process for the gaply:// deep link;
# single-instance (with the deep-link feature) forwards the URL to the already
# running app. macOS delivers deep links to the running app natively, so it's
# not needed there.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# macOS-only: the AI-Check RAM gate reads total physical memory via
# sysctlbyname("hw.memsize") to decide whether the SLM-1 7B deep pass may run
# (proven-fatal on 8GB). libc 0.2 is already in the lockfile via candle.
[target.'cfg(unix)'.dependencies]
# macOS: sysctlbyname("hw.memsize") for the SLM-1 tier gate. Unix generally:
# termios, so `label-cn` can read a single keypress (§11 D71).
libc = "0.2"

# §11 D228: this header was replaced by `cfg(unix)` in 69a5ad1 (4 Sep) to give
# `label-cn` libc on Linux, which also moved Metal and objc2 under unix: the app
# crate did not compile on Linux (`objc2` only works on Apple platforms) until
# the first CI job that built it there. libc stays under `cfg(unix)` above.
[target.'cfg(target_os = "macos")'.dependencies]
# Phase 7 gate (§11 D36). macOS only, and cargo unifies these with the base
# candle dependencies so a Linux/Windows build is byte-for-byte unchanged.
#
# NO C TOOLCHAIN IS ADDED — re-verified, not assumed: of the crates this pulls
# in only `pulp` has a build script, and it is pure-Rust codegen emitting
# `core::arch::global_asm!` with `version_check` as its sole build-dependency.
# candle-metal-kernels declares `build = false` and compiles its `.metal`
# shaders AT RUNTIME from `include_str!`d source.
#
# Enabling the feature does NOT mean Metal runs: `ai::device` gates the probe
# behind a class-availability check first (D35/D36).
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

# For the gate itself: `AnyClass::get` returns Option and cannot panic, which is
# the whole point — it is the one way to ask "does this class exist?" without
# constructing it.
objc2 = "0.6"

[dev-dependencies]
# §11 D103. The wire-contract guard parses this crate's own source to enumerate
# every type a #[tauri::command] returns or streams. syn is already in the lock
# file (transitively, via proc macros), so this adds no download — and a guard
# that exists BECAUSE a guard failed must not itself be held together by regex.
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1"
# Reads the rendered report back OUT of the PDF bytes for the render-path
# end-to-end test (ONTOLOGY §4.20). Already a gaply-core dependency; declared
# here because a dependency of a dependency is not in scope for this crate.
pdf-extract = "0.7"
tauri = { version = "2.11.3", features = ["test"] }
