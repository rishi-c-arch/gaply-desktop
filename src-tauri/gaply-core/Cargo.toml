[package]
name = "gaply_core"
version = "0.1.0"
description = "Gaply business logic — portable, Tauri-free"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
sqlite-vec = "0.1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
