# Does the COMMITTED tree build?
#
# `main` did not compile for weeks while every local run was green, because two
# things committed code referenced lived only in a working tree:
# `gaply-core/src/scientific_model.rs` (declared by df4eef3, never added) and
# `sentences_in` in `extract/sentence.rs`. A local `cargo test --workspace`
# compiles the tree, uncommitted files included, so it structurally cannot see a
# missing `git add`. The one workflow that would have caught it —
# windows-build-check — is dispatch-only and effectively never ran.
#
# This job exists so that gap fails HERE, on a push, rather than on someone's
# future clone. It is deliberately cheap: no Node, no npm, no Tauri
# prerequisites, no bundled model. It builds and tests `gaply_core`, which is
# the portable crate and MUST build from source alone.
name: Clean checkout

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: clean-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gaply-core:
    name: gaply_core builds and tests from source alone
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the verify script below creates a git worktree,
      # which a depth-1 clone cannot do. The build itself does not need history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # src-tauri/ is not on every ref; skip cleanly rather than failing with a
      # cryptic path error, matching windows-build-check's own detection.
      - name: Detect Tauri project
        id: detect
        run: |
          if [ -d src-tauri ] && [ -f src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No src-tauri on this ref::skipped"
          fi

      # gaply_core reaches the OS keychain through `keyring`, and on Linux that
      # is Secret Service over D-Bus:
      #   gaply_core -> keyring (sync-secret-service) -> dbus-secret-service
      #              -> dbus -> libdbus-sys, whose build script needs dbus-1.pc
      # The macOS and Windows builds use the native backends and need none of
      # this, which is why it never showed up locally. It is a RUNNER
      # prerequisite, not a portability defect: the per-platform keyring
      # features are a deliberate choice documented in gaply-core/Cargo.toml,
      # and weakening them to make a Linux runner happy would be changing the
      # product to suit the pipeline.
      - name: Install Linux build prerequisites (D-Bus for keyring)
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          # libdbus-1-dev + pkg-config: the BUILD requirement.
          # gnome-keyring + dbus-x11: the RUNTIME one — `secrets.rs` talks to a
          # live Secret Service daemon, and a bare runner has none.
          sudo apt-get install -y libdbus-1-dev pkg-config gnome-keyring dbus-x11

      - name: Install Rust (stable)
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # THE GUARD. A CI checkout is already exactly the committed tree — that is
      # the property the whole job turns on — so building it here IS the check,
      # and a file nobody staged fails on this line.
      - name: cargo check -p gaply_core --all-targets
        if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo check -p gaply_core --all-targets

      # Inside a session bus with an unlocked keyring. `secrets.rs` is a thin
      # wrapper over the OS credential store and its tests exercise a REAL one
      # — that is the point of them, and stubbing the store to make CI pass
      # would delete the only coverage the wrapper has. gaply-core/Cargo.toml
      # already documents the requirement: "at RUNTIME a Secret Service daemon
      # (gnome-keyring / KWallet) must be running". So the runner provides one.
      - name: cargo test -p gaply_core (with a Secret Service daemon)
        if: steps.detect.outputs.present == 'true'
        working-directory: src-tauri
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1 || true
            cargo test -p gaply_core
          ' 

      # Runs the LOCAL guard against itself. Redundant as a build check — the
      # checkout above is already clean — and kept anyway for one reason: the
      # script is what developers run before merging, and a guard that silently
      # stops working is worse than none. This fails if the script rots.
      #
      # It reports SKIPPED for the app crate here, and that is correct rather
      # than a gap: the build script needs `bundled-models/*.gguf`, ~400 MB and
      # gitignored by design, which CI has no way to provide. gaply_core is the
      # crate that must build from source alone and is fully checked above.
      - name: verify-clean-checkout.sh still works
        if: steps.detect.outputs.present == 'true'
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1 || true
            ./scripts/verify-clean-checkout.sh
          ' 
