# Windows compatibility check for the Gaply Tauri desktop app.
#
# ISOLATION FROM VERCEL — this workflow is completely additive and cannot
# trigger the existing Vercel deployment:
#   * Vercel deploys via its own GitHub *Git integration* (it reacts to git
#     push/PR webhooks), NOT via GitHub Actions. This workflow never runs any
#     `vercel` command and never pushes commits, so it cannot cause a deploy.
#   * It never triggers on main/master and has no schedule or PR trigger.
# See the report accompanying this file for the full trigger analysis.

name: Windows Build Check

on:
  # NO LONGER dispatch-only. It was, and that is half the reason a broken `main`
  # survived for weeks: the only workflow that builds a clean checkout never
  # ran. The Vercel isolation that motivated dispatch-only is now moot — the old
  # `origin` (RishiSTARP/gaply-react-frontend) was deleted in the phase-0 history
  # purge and 404s, and nothing here has ever run a `vercel` command or pushed a
  # commit.
  #
  # This build is heavy (npm ci, a full Tauri Windows build), so it runs where
  # the cost buys something — on pull requests and on main — while the cheap
  # `clean-checkout` workflow carries the missing-`git add` guard on every push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Least privilege: read the code + upload an artifact. No write to the repo.
permissions:
  contents: read

# Don't stack overlapping runs of this (heavy) build.
concurrency:
  group: windows-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build & test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow builds/tests the Tauri desktop project, which lives under
      # src-tauri/. That directory is NOT present on every ref (e.g. main, before
      # the desktop work is merged). Detect it up front so the Tauri-specific
      # steps skip cleanly with a clear message instead of failing with a cryptic
      # "The directory name is invalid" when `working-directory: src-tauri` points
      # at a path that doesn't exist. Dispatch this workflow against a ref that
      # contains src-tauri/ (the desktop branch) to actually run the build.
      - name: Detect Tauri project
        id: detect_tauri
        shell: bash
        run: |
          if [ -d "src-tauri" ] && [ -f "src-tauri/tauri.conf.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Tauri project detected on this ref — build/test steps will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tauri project not present::Tauri project not present on this ref - skipped. (src-tauri/ not found; dispatch against the desktop branch to build.)"
          fi

      # WebView2 Runtime ships preinstalled on the windows-latest runner image,
      # and the MSVC toolchain (needed to build the Tauri Windows binary) is
      # present too — so no extra Tauri prerequisite install is required here.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.detect_tauri.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        # Node 22.x to match package.json "engines": { "node": "22.x" }.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        # Fail fast instead of silently hanging for 45+ minutes if a postinstall
        # binary download stalls again.
        timeout-minutes: 10
        # `npm ci` is deterministic (installs package-lock.json exactly) and the
        # right choice for CI.
        #
        # Do NOT pass `--omit=optional`: napi platform binaries are declared as
        # OPTIONAL dependencies (e.g. @tauri-apps/cli-win32-x64-msvc, plus
        # esbuild/rollup native bindings). Omitting optionals removes the Tauri
        # CLI's Windows native binding and `npm run tauri build` fails with
        # "Cannot find native binding … @tauri-apps/cli-win32-x64-msvc". So we
        # keep optionals. pdfjs-dist's optional `canvas` installs from a prebuilt
        # (no Cairo/GTK compile on a normal runner); the timeout below guards the
        # rare source-build fallback.
        #
        # The 45-min hang was NOT canvas — it was Chromium downloads: puppeteer
        # (direct devDep, v21) plus two legacy puppeteer@1.20 copies via
        # react-snap / minimalcss each fetch a full Chromium at postinstall. This
        # job never launches a browser, so we skip every Chromium download (both
        # the modern and legacy env-var names).
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      # Windows CI validates the PORTABLE core crate (gaply_core). It links no
      # GUI stack and holds the genuinely Windows-specific code — notably the
      # Credential Manager keyring backend a macOS check can't cover.
      #
      # We deliberately do NOT run `cargo test --workspace` here. The `app`
      # crate's IPC tests (tests/commands_test.rs) link Tauri's wry/tao native
      # webview stack; on Windows that test binary dies at LOAD with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) before the harness runs, so a
      # `--workspace` run goes red regardless of the tests' own outcome. Those
      # tests are #[cfg_attr(windows, ignore)] and run on macOS/Linux; the
      # diagnostic step below records exactly which import fails to resolve.
      - name: Run Rust test suite (gaply_core — portable/Windows-relevant logic)
        if: steps.detect_tauri.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo test -p gaply_core

      # tauri.conf.json lists `bundled-models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf`
      # (~400 MB) and `bundled-models/tokenizer.json` (~11 MB) as bundle
      # resources. Both are gitignored, so a clean checkout does not have them
      # and the build script stops with `resource path ... doesn't exist`.
      #
      # The build is therefore GATED rather than faked. Substituting placeholder
      # files would let it succeed and would upload a real, installable MSI/NSIS
      # containing a model that cannot work — a worse outcome than not building,
      # because the artifact looks legitimate. Everything that checks Windows
      # PORTABILITY — the full cargo compile and the gaply_core test suite —
      # runs above this line and is unaffected.
      - name: Detect bundled model resources
        id: detect_models
        if: steps.detect_tauri.outputs.present == 'true'
        shell: bash
        run: |
          if [ -f "src-tauri/bundled-models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" ] \
             && [ -f "src-tauri/bundled-models/tokenizer.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bundle skipped::bundled-models/*.gguf and tokenizer.json are gitignored (~400 MB) and absent on a clean checkout, so the installer is not built. The Windows compile and the gaply_core test suite both ran."
          fi

      # Produces the real Windows installers (bundle.targets = "all" → MSI + NSIS).
      # beforeBuildCommand builds the CRA frontend first.
      - name: Build Tauri Windows app
        if: steps.detect_tauri.outputs.present == 'true' && steps.detect_models.outputs.present == 'true'
        run: npm run tauri build

      - name: Upload Windows installer(s)
        if: steps.detect_tauri.outputs.present == 'true' && steps.detect_models.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gaply-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      # DIAGNOSTIC (Option C) — records exactly which DLL/entrypoint the IPC test
      # binary fails to resolve at load on Windows. Non-fatal (continue-on-error)
      # so it never turns the job red; it's here to name the culprit for the
      # record, not to gate anything. `--no-run` compiles+links commands_test
      # (which builds fine — the failure is only at load), then we run it to
      # capture the 0xc0000139 exit and dumpbin its import table.
      - name: (diagnostic) inspect IPC test binary imports
        # always() so we still capture this even if an earlier step (e.g. the
        # Tauri build) fails — it's independent forensic data, not a gate.
        if: always() && steps.detect_tauri.outputs.present == 'true'
        continue-on-error: true
        working-directory: src-tauri
        shell: pwsh
        run: |
          Write-Host "Building app-crate IPC test binary (no run)…"
          $lines = cargo test -p app --test commands_test --no-run --message-format=json 2>$null
          $exe = $null
          foreach ($l in $lines) {
            try { $o = $l | ConvertFrom-Json } catch { continue }
            if ($o.reason -eq 'compiler-artifact' -and $o.target.name -eq 'commands_test' -and $o.executable) {
              $exe = $o.executable
            }
          }
          if (-not $exe) { Write-Host "Could not locate commands_test.exe — skipping diagnostic."; exit 0 }
          Write-Host "Test binary: $exe"

          New-Item -ItemType Directory -Force -Path diag | Out-Null

          Write-Host "=== Load attempt (expected to fail at load on Windows) ==="
          & "$exe" --list 2>&1 | Out-Host
          $code = $LASTEXITCODE
          # Force 64-bit arithmetic: a negative int32 exit code (e.g. -1073741511)
          # can't cast straight to uint32; mask as int64 first. (0xffffffffL keeps
          # the AND in Int64 so 0xC0000139 fits.)
          $hex = ('0x{0:X8}' -f [uint32]([int64]$code -band 0xffffffffL))
          Write-Host "exit code: $code ($hex)  [0xC0000139 == STATUS_ENTRYPOINT_NOT_FOUND]"
          "exit code: $code ($hex)" | Out-File diag\commands_test.exit.txt

          # Locate dumpbin via vswhere (present on windows-latest).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -property installationPath 2>$null
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "=== Dependent DLLs (dumpbin /dependents) ==="
            & $dumpbin.FullName /dependents "$exe" | Tee-Object diag\commands_test.dependents.txt | Select-String '\.dll' | Out-Host
            & $dumpbin.FullName /imports "$exe" | Out-File diag\commands_test.imports.txt
            Write-Host "Full import table written to diag/commands_test.imports.txt (uploaded as an artifact)."
          } else {
            Write-Host "dumpbin not found; skipped import dump."
          }
          exit 0

      - name: (diagnostic) upload IPC import dump
        if: always() && steps.detect_tauri.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: commands_test-imports-diagnostic
          path: src-tauri/diag/*.txt
          if-no-files-found: warn
          retention-days: 14

      # Visible confirmation in the step list when this ref has no Tauri project,
      # so a run against e.g. main reads as an intentional skip, not a silent pass.
      - name: Tauri build/test skipped (no src-tauri on this ref)
        if: steps.detect_tauri.outputs.present == 'false'
        shell: bash
        run: |
          echo "Tauri project not present on this ref - skipped."
          echo "src-tauri/ was not found in the checkout, so the Rust test suite,"
          echo "the Tauri Windows build, and the installer upload were all skipped."
          echo "Dispatch this workflow against the desktop branch to run the full build."
