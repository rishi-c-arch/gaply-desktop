# Windows compatibility check for the Gaply Tauri desktop app.
#
# ISOLATION FROM VERCEL — this workflow is completely additive and cannot
# trigger the existing Vercel deployment:
#   * Vercel deploys via its own GitHub *Git integration* (it reacts to git
#     push/PR webhooks), NOT via GitHub Actions. This workflow never runs any
#     `vercel` command and never pushes commits, so it cannot cause a deploy.
#   * It never triggers on main/master and has no schedule or PR trigger.
# See the report accompanying this file for the full trigger analysis.

name: Windows Build Check

on:
  # Manual dispatch ONLY — this workflow never runs automatically on any push,
  # PR, or schedule. It is the zero-Vercel-interaction path: trigger it by hand
  # from the Actions tab (or `gh workflow run`) against whatever ref you choose.
  # (To also run it on a dedicated non-main branch, add a `push:` trigger for
  # that branch — never main/master, to stay clear of the Vercel production deploy.)
  workflow_dispatch: {}

# Least privilege: read the code + upload an artifact. No write to the repo.
permissions:
  contents: read

# Don't stack overlapping runs of this (heavy) build.
concurrency:
  group: windows-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build & test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow builds/tests the Tauri desktop project, which lives under
      # src-tauri/. That directory is NOT present on every ref (e.g. main, before
      # the desktop work is merged). Detect it up front so the Tauri-specific
      # steps skip cleanly with a clear message instead of failing with a cryptic
      # "The directory name is invalid" when `working-directory: src-tauri` points
      # at a path that doesn't exist. Dispatch this workflow against a ref that
      # contains src-tauri/ (the desktop branch) to actually run the build.
      - name: Detect Tauri project
        id: detect_tauri
        shell: bash
        run: |
          if [ -d "src-tauri" ] && [ -f "src-tauri/tauri.conf.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Tauri project detected on this ref — build/test steps will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tauri project not present::Tauri project not present on this ref - skipped. (src-tauri/ not found; dispatch against the desktop branch to build.)"
          fi

      # WebView2 Runtime ships preinstalled on the windows-latest runner image,
      # and the MSVC toolchain (needed to build the Tauri Windows binary) is
      # present too — so no extra Tauri prerequisite install is required here.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.detect_tauri.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        # Node 22.x to match package.json "engines": { "node": "22.x" }.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        # Fail fast instead of silently hanging for 45+ minutes if a postinstall
        # binary download stalls again.
        timeout-minutes: 10
        # `npm ci` is deterministic (installs package-lock.json exactly) and the
        # right choice for CI. `--omit=optional` skips pdfjs-dist's OPTIONAL
        # `canvas` dep, whose node-gyp/Cairo native build hangs on Windows and is
        # never needed here (the browser build doesn't use the Node canvas binding).
        #
        # The Chromium downloads are the real culprit: puppeteer (direct devDep,
        # v21) plus two legacy puppeteer@1.20 copies pulled in by react-snap /
        # minimalcss each fetch a full Chromium at postinstall — the old revisions
        # stall for tens of minutes with no progress output. This job only runs
        # `cargo test` + `npm run tauri build`, which never launch a browser, so we
        # skip every Chromium download (both the modern and legacy env-var names).
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci --omit=optional

      # Runs natively on Windows — all 135 tests (gaply_core unit + golden +
      # the app crate's Tauri IPC tests), including the Windows Credential
      # Manager keyring backend, which a macOS cross-compile check cannot cover.
      - name: Run Rust test suite (gaply_core + app)
        if: steps.detect_tauri.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo test --workspace

      # Produces the real Windows installers (bundle.targets = "all" → MSI + NSIS).
      # beforeBuildCommand builds the CRA frontend first.
      - name: Build Tauri Windows app
        if: steps.detect_tauri.outputs.present == 'true'
        run: npm run tauri build

      - name: Upload Windows installer(s)
        if: steps.detect_tauri.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gaply-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      # Visible confirmation in the step list when this ref has no Tauri project,
      # so a run against e.g. main reads as an intentional skip, not a silent pass.
      - name: Tauri build/test skipped (no src-tauri on this ref)
        if: steps.detect_tauri.outputs.present == 'false'
        shell: bash
        run: |
          echo "Tauri project not present on this ref - skipped."
          echo "src-tauri/ was not found in the checkout, so the Rust test suite,"
          echo "the Tauri Windows build, and the installer upload were all skipped."
          echo "Dispatch this workflow against the desktop branch to run the full build."
