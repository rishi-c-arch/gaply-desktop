name: Frontend build

# THE GATE THAT WAS CONFIGURED AND NEVER RAN.
#
# `npm run build` is react-scripts, which treats every eslint warning as an
# ERROR when CI is set — and GitHub Actions always sets it. So the repo has had
# a strict frontend gate the whole time. It just had no path to execute:
#
#   * windows-build-check runs `npm run tauri build`, whose beforeBuildCommand
#     IS `npm run build` — but that step is gated on the bundled models, which
#     are gitignored (~400 MB) and absent from a clean checkout, so it is
#     SKIPPED on every run. The model gate is correct on its own terms (faking
#     the weights would upload an installable artifact containing a model that
#     cannot work); it just takes the frontend build down with it.
#   * package-release reaches the same beforeBuildCommand through tauri-action,
#     but is workflow_dispatch only and has never run.
#
# The result was 15 eslint warnings accumulating unseen across 11 files, which
# would have surfaced for the first time during a real release packaging. This
# job is deliberately cheap — no Rust, no Tauri prerequisites, no model — so the
# gate runs on every push and a warning is caught by the commit that adds it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: npm run build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.x to match package.json "engines".
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # Same Chromium skips as windows-build-check: puppeteer and two legacy
        # copies via react-snap/minimalcss each fetch a full Chromium at
        # postinstall, and nothing here launches a browser.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        timeout-minutes: 10
        run: npm ci

      # THE LINT GATE IS A SEPARATE STEP, ON PURPOSE.
      #
      # `npm run build` does NOT lint. It is `node scripts/cra-build.js`, which
      # does `delete env.CI` and sets DISABLE_ESLINT_PLUGIN=true, for the reason
      # in its own header: Vercel sets CI=true and CRA turns warnings into
      # errors. That reasoning is sound and the script is shared with the web
      # lineage, so it is left alone and the gate sits beside the build instead.
      #
      # SCOPE, and why it is not a bare `eslint src`:
      #   · Test files are excluded. The repo's vitest suites put `vi.mock(...)`
      #     above their imports, which is the required hoisting idiom and which
      #     CRA's `react-app` config reports as 66 `import/first` ERRORS. The
      #     rule is wrong for these files rather than the files being wrong, and
      #     react-scripts never linted them either. 114 problems live here.
      #   · Everything else in src/ IS linted, including five components that
      #     nothing imports (HeroR3F, LoadingSpinner, PremiumLoginBackground,
      #     PremiumSignupBackground, TurnitinStyleReportGenerator). They were
      #     never linted before because react-scripts only lints the webpack
      #     graph, and they hold built-but-never-wired fragments — marked in
      #     place rather than deleted, so parked work stays visible.
      #
      # Negative control run before this was added: one unused variable takes
      # the step to exit 1; reverting it returns exit 0.
      - name: Lint
        run: npx eslint src --max-warnings 0
          --ignore-pattern '**/*.vitest.*'
          --ignore-pattern '**/*.test.*'
          --ignore-pattern 'src/setupTests.ts'

      # THE FRONTEND SUITE, which ran in no workflow until §11 D227: 970 vitest
      # tests (75 files, measured 24 Sep 2026) were local-only, so every
      # frontend guard — the report viewer's tab tests, the checklist mirror,
      # the gating pair — could go red on a push and nothing remote would say
      # so. vitest exits non-zero on a failure AND when it finds no test files,
      # so an include pattern that stops matching fails here too.
      - name: Test (vitest)
        run: npx vitest run --config vitest.config.ts

      - name: Build
        # CI is already true on Actions; set explicitly so this reproduces
        # locally. Note it changes nothing about linting — cra-build.js deletes
        # CI before react-scripts sees it. Measured: a deliberate type error
        # takes `npm run build` to exit 1 (TS2322); a deliberate unused variable
        # leaves it at exit 0. It is a COMPILATION and TYPE gate, which is worth
        # having on every push and is not the same thing as the step above.
        env:
          CI: 'true'
        run: npm run build
